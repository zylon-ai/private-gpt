name: Forward-port maintenance fixes
on:
  pull_request_target:
    types: [closed]
    branches: ['release/**']
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: forward-port-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  forward-port:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      # Only trusted trunk code is executed. The source PR is read as a git diff.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PAT }}
      - name: Open a code-only PR onto main
        env:
          GH_${{ secrets.PAT }}: ${{ secrets.PAT }}
        run: python3 .github/scripts/release_policy.py forward-port
