name: Release policy

on:
  pull_request:
    branches: ['main', 'release/**']
  push:
    branches: ['main']
    paths: ['.github/**', '*release-please*.json', 'version.txt']

permissions:
  contents: read

jobs:
  release-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate release configuration and maintenance version range
        env:
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: python3 .github/scripts/release_policy.py validate --branch "$TARGET_BRANCH"
      - name: Test policy and real-git forward-port behavior
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Test main-only image tags
        run: node --test .github/scripts/test_image_tags.cjs
